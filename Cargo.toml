[package]
name = "minizlib"
version = "0.1.2"
edition = "2024"
rust-version = "1.89"
description = "Deprecated: superseded by compcol's `embed::flate`, which this crate now re-exports. Tiny no_std, no-alloc gzip / zlib / deflate"
license = "MIT"
readme = "README.md"
repository = "https://github.com/KarpelesLab/minizlib"
keywords = ["gzip", "zlib", "deflate", "inflate", "no_std"]
categories = ["compression", "no-std", "no-std::no-alloc", "embedded"]
exclude = [".github", "release-plz.toml"]

[features]
default = [
    "decompress",
    "compress",
    "gzip",
    "zlib",
    "checksum",
    "concat",
    "stored",
    "fixed",
    "dynamic",
]

# The two halves of the crate.
decompress = []
compress = []

# Containers. Raw deflate is always available.
gzip = ["compcol/gzip"]
zlib = ["compcol/zlib"]

# Kept so that existing feature lists still build; they no longer change
# anything. compcol always verifies checksums, decodes concatenated gzip
# members and all three block types, and uses the 16-entry CRC-32 table.
checksum = []
crc-table = []
concat = []
stored = []
fixed = []
dynamic = []

[[example]]
name = "gzip"
required-features = ["compress", "gzip"]

[[example]]
name = "gunzip"
required-features = ["decompress", "gzip", "zlib"]

[dependencies]
# The code lives on as compcol's `embed::flate`; this crate only re-exports it.
compcol = { version = "0.7.2", default-features = false, features = ["embed", "deflate"] }

[dev-dependencies]
flate2 = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
